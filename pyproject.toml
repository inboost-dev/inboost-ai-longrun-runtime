[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inboost-longrun"
version = "0.3.0"
description = "InBoost LongRun: Local context conservation, quota extension, and verification engine for AI coding agents."
readme = "README.md"
license = { text = "InBoost LongRun Evaluation License Agreement" }
authors = [
    { name = "InBoost Technologies", email = "inbound@inboost.pro" }
]
requires-python = ">=3.8"
dependencies = []
keywords = ["inboost", "longrun", "mcp", "ai-agents", "claude-code", "cursor", "ast", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
urls = { Homepage = "https://inboost.pro", Repository = "https://github.com/inboost-dev/inboost-ai-longrun-runtime", Issues = "https://github.com/inboost-dev/inboost-ai-longrun-runtime/issues" }

[project.scripts]
inboost-longrun = "inboost_longrun.cli:main"
inboost-ai-longrun = "inboost_longrun.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inboost_longrun*"]

[tool.setuptools.package-data]
inboost_longrun = ["*.lic", "bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W291"]



